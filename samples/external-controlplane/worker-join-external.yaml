  config: |
    joinConfiguration:
      discovery:
        bootstrapToken:
          # From `kubeadm token create --ttl 1h` on the external control plane.
          token: "abcdef.0123456789abcdef"
          apiServerEndpoint: "10.0.0.5:6443"
          # Omitted on purpose: the pin is derived from ca_certs above. Set it
          # as well if you already have it, and the two are cross-validated.
          # caCertHashes:
          #   - "sha256:REPLACE-WITH-CA-SPKI-PIN"
