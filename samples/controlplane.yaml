#cloud-config
# Kairos cloud-config for an ADDITIONAL control-plane node joining a kubeadm
# cluster bootstrapped by provider-kubernetes.
#
# STATUS: this provider is under active development and is NOT field-ready.
#
# As with workers, join material is delivered HERE by the operator / management
# plane. A control-plane join additionally needs a fresh certificate key.
#
# Easiest way to produce this file, run on an existing control-plane node:
#   sudo agent-provider-kubernetes mint-join --role controlplane --ttl 2h \
#     --cluster-token "<the cluster's cluster_token>"
# It mints the token + CA pin + a fresh certificate-encryption key. By hand the
# cert key comes from: kubeadm init phase upload-certs --upload-certs

install:
  device: "auto"
  auto: true
  reboot: true

users:
  # Kairos 3.3+ requires at least one user in the 'admin' group for
  # kairos-agent install to proceed (or set install.nousers: true).
  - name: kairos
    groups: ["admin", "sudo"]
    passwd: kairos

cluster:
  cluster_token: "CHANGE-ME-to-a-long-high-entropy-cluster-correlation-string"
  control_plane_host: "192.168.1.10"
  role: controlplane

  providerConfig:
    cluster_root_path: "/"

  config: |
    joinConfiguration:
      discovery:
        bootstrapToken:
          token: "abcdef.0123456789abcdef"
          apiServerEndpoint: "192.168.1.10:6443"
          caCertHashes:
            - "sha256:REPLACE-WITH-CA-SPKI-PIN"
      controlPlane:
        # Fresh per join; the upstream kubeadm-certs secret carries a 2h expiry
        # that the provider deliberately does NOT strip.
        certificateKey: "REPLACE-WITH-FRESH-CERT-KEY"

stages:
  initramfs:
    - commands:
        - true
