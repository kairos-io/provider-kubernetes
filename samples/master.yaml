#cloud-config
# Kairos cloud-config for the FIRST control-plane node of a kubeadm cluster
# bootstrapped by provider-kubernetes.
#
# STATUS: this provider is under active development and is NOT field-ready.
#
# Read before deploying:
# - cluster_token MUST be at least 16 characters and SHOULD have >= 128 bits of
#   estimated entropy (the provider rejects shorter values and warns on
#   low-entropy values). It is a CORRELATION value, not a credential: the
#   provider does NOT derive any join secret from it (kubeadm-native CSPRNG
#   tokens are used instead). Treat it as confidential anyway.
# - control_plane_host must be an IP/host this node and all joiners can reach.
# - kubernetesVersion under config: must be within the supported window
#   (1.34 / 1.35 / 1.36) and is compared against the kubeadm binary at runtime;
#   a mismatched pin is a hard error (fail-fast).
# - Install a CNI plugin (Flannel, Calico, Cilium, ...) AFTER the cluster
#   initializes. The provider does not install one.

install:
  device: "auto"
  auto: true
  reboot: true

users:
  - name: kairos
    groups: ["sudo"]
    passwd: kairos

cluster:
  # CHANGE THIS to a long, high-entropy string. See note above; the provider
  # will reject empty / <16-char tokens.
  cluster_token: "CHANGE-ME-to-a-long-high-entropy-cluster-correlation-string"

  # CHANGE THIS to the actual IP of this node (the API server endpoint).
  control_plane_host: "192.168.1.10"

  role: init

  providerConfig:
    cluster_root_path: "/"

  config: |
    clusterConfiguration:
      kubernetesVersion: v1.34.0
      controlPlaneEndpoint: "192.168.1.10:6443"
      networking:
        podSubnet: "10.244.0.0/16"      # Flannel default
        serviceSubnet: "10.96.0.0/12"   # Kubernetes default

stages:
  initramfs:
    - commands:
        # Convenience: expose the kubeadm-generated admin kubeconfig.
        - ln -sf /etc/kubernetes/admin.conf /run/kubeconfig
