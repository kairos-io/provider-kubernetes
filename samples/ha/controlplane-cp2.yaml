#cloud-config
# Kairos cloud-config for an ADDITIONAL control-plane node (cp2) joining the HA
# cluster initialized by init-cp1.yaml. cp3, cp4, ... are identical except for
# control_plane_host and localAPIEndpoint.advertiseAddress (each node's own IP).
#
# STATUS: under active development; NOT field-ready.
#
# SECURITY -- READ THIS. The certificateKey below is a CLUSTER ROOT CREDENTIAL.
# It decrypts the uploaded cluster PKI, INCLUDING THE CA PRIVATE KEY. Anyone who
# obtains it (plus a live bootstrap token and reachability of the API server)
# can mint a cert for any identity and take over the cluster permanently. It is
# categorically more sensitive than a worker join token. Therefore:
#   - Deliver this file ONLY over a confidential, integrity-protected channel.
#   - Mint it JUST BEFORE bringing cp2 up: the token is short-lived (default 1h)
#     and the upstream kubeadm-certs secret carrying the encrypted PKI expires
#     in 2h (the provider deliberately does NOT strip that expiry).
#   - Mint a FRESH certificateKey per control-plane join; never reuse or persist.
#   - Do not log it, commit it, or leave this file on persistent storage after
#     first boot. The provider itself persists none of this material and shreds
#     the transient config it writes; the cloud-config userdata lifetime is yours
#     to control.
#   - NOTE: the provider performs NO node attestation in v1. The delivery channel
#     is the trust boundary -- whoever can read this file can join as a control
#     plane. (TPM2 node attestation is the designated future hardening.)
#
# Produce this file from an existing, healthy control-plane node:
#   sudo agent-provider-kubernetes mint-join --role controlplane --ttl 1h \
#     --advertise-address 192.168.1.12 \
#     --cluster-token "<the cluster's cluster_token>"
# mint-join mints the bootstrap token + CA SPKI pin AND re-uploads the cluster
# certs under a fresh certificate key (so the key matches what is in etcd), then
# prints a ready-to-edit cloud-config.

install:
  device: "auto"
  auto: true
  reboot: true

users:
  - name: kairos
    groups: ["admin", "sudo"]
    passwd: kairos

cluster:
  cluster_token: "CHANGE-ME-to-match-the-control-plane-cluster_token"

  # The STABLE HA endpoint (same VIP/LB/DNS as init-cp1.yaml), NOT cp1's IP.
  control_plane_host: "k8s-api.example.test:6443"

  role: controlplane

  providerConfig:
    cluster_root_path: "/"

  config: |
    joinConfiguration:
      discovery:
        bootstrapToken:
          token: "abcdef.0123456789abcdef"
          apiServerEndpoint: "k8s-api.example.test:6443"
          caCertHashes:
            - "sha256:REPLACE-WITH-CA-SPKI-PIN"
      controlPlane:
        # CLUSTER ROOT CREDENTIAL -- see the SECURITY note above.
        certificateKey: "REPLACE-WITH-FRESH-CERT-KEY"
        localAPIEndpoint:
          # cp2's OWN routable IP. Required on multi-homed nodes; the minting CP
          # cannot know it, so the operator fills it in (mint-join writes a
          # FILL-IN-THIS-NODE-IP placeholder when --advertise-address is omitted).
          advertiseAddress: "192.168.1.12"
          bindPort: 6443

stages:
  initramfs:
    - commands:
        - ln -sf /etc/kubernetes/admin.conf /run/kubeconfig
