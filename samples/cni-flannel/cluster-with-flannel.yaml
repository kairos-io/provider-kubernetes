#cloud-config
# FIRST control-plane node (role: init) that ALSO installs the Flannel CNI from
# the same cloud-config -- a fully declarative "cluster + CNI in one file" example.
#
# Flannel is the simplest, most neutral CNI: a single upstream manifest, no
# operator, no CRDs. Its default pod network is 10.244.0.0/16, which already
# matches the podSubnet used across these samples -- so for the common lab / single
# -node "boot -> Ready cluster" case it is the least-friction choice. (For network
# policy / eBPF / HA-oriented deployments see ../cni-calico. The provider itself is
# CNI-agnostic by design -- principle #3, no vendor lock-in -- so this is one
# example, not a default.)
#
# How it works: the provider runs `kubeadm init` in its network.after stage. A
# self-contained systemd one-shot (installed below) waits for the kubeadm
# admin.conf + a healthy API, then applies the pinned Flannel manifest. Because the
# unit self-waits and is idempotent, it does not depend on yip stage ordering
# relative to the provider's reconcile, and it re-runs harmlessly on reboot (a
# sentinel skips re-apply once it has succeeded). On a non-control-plane node
# admin.conf never appears, so the unit is a graceful no-op there.
#
# This needs outbound internet on the control-plane node (it fetches the pinned
# kube-flannel manifest + Flannel images). For an air-gapped cluster, mirror the
# manifest + images internally (or pre-bundle them, cf. ADR-16) and point
# FLANNEL_URL at the local copy.
#
# IMPORTANT: Flannel's manifest hardcodes its pod network to 10.244.0.0/16. If you
# change podSubnet below, you MUST also change Flannel's net-conf `Network` (edit
# the kube-flannel-cfg ConfigMap) to match, or pods will not get routable IPs.
#
# STATUS: early public release; adapt to your environment, not yet certified for production.

install:
  device: "auto"
  auto: true
  reboot: true

users:
  # Kairos 3.3+ requires at least one user in the 'admin' group for auto-install.
  - name: kairos
    groups: ["admin", "sudo"]
    passwd: kairos

cluster:
  cluster_token: "CHANGE-ME-to-a-long-high-entropy-cluster-correlation-string"
  control_plane_host: "192.168.1.10"
  role: init
  providerConfig:
    cluster_root_path: "/"
  config: |
    clusterConfiguration:
      kubernetesVersion: v1.34.0
      controlPlaneEndpoint: "192.168.1.10:6443"
      networking:
        podSubnet: 10.244.0.0/16
        serviceSubnet: 10.96.0.0/12

stages:
  boot:
    - name: stage Flannel install script
      files:
        - path: /usr/local/bin/provider-kubernetes-install-cni.sh
          permissions: 493   # 0755
          owner: 0
          group: 0
          content: |
            #!/bin/bash
            # Install Flannel once the local kubeadm control plane is up. Self-
            # waiting + idempotent: safe regardless of stage ordering and reboots.
            set -eu
            export KUBECONFIG=/etc/kubernetes/admin.conf
            KUBECTL=/usr/bin/kubectl
            SENTINEL=/var/lib/provider-kubernetes-cni/.installed
            # Pinned Flannel release (verify the current release at
            # https://github.com/flannel-io/flannel/releases).
            FLANNEL_URL=https://github.com/flannel-io/flannel/releases/download/v0.28.5/kube-flannel.yml

            mkdir -p /var/lib/provider-kubernetes-cni
            [ -f "$SENTINEL" ] && { echo "flannel already installed"; exit 0; }

            # Wait (bounded ~10m) for admin.conf + a ready API. On a non-control-
            # plane node admin.conf never appears, so this is a graceful no-op.
            for _ in $(seq 1 120); do
              if [ -f "$KUBECONFIG" ] && "$KUBECTL" get --raw=/readyz >/dev/null 2>&1; then
                break
              fi
              sleep 5
            done
            [ -f "$KUBECONFIG" ] || { echo "no admin.conf; nothing to do here"; exit 0; }

            # kubectl apply is idempotent across retries/reboots.
            "$KUBECTL" apply -f "$FLANNEL_URL"

            touch "$SENTINEL"
            echo "flannel install applied"
        - path: /etc/systemd/system/provider-kubernetes-cni-install.service
          permissions: 420   # 0644
          owner: 0
          group: 0
          content: |
            [Unit]
            Description=Install Flannel CNI once the kubeadm control plane is up
            After=network-online.target
            Wants=network-online.target
            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/local/bin/provider-kubernetes-install-cni.sh
            [Install]
            WantedBy=multi-user.target
      commands:
        - systemctl daemon-reload
        - systemctl enable --now provider-kubernetes-cni-install.service || true
