# provider-kubernetes, ADR-19 U1 (F-UNITPATH). The kubelet resolves its helpers
# by name: mount and umount (every secret and projected service-account token
# volume), systemd-run, fsck/mkfs.<fs>, blkid, losetup, and iptables/ip6tables plus
# their -save/-restore forms for the startup and canary rules. systemd's default
# PATH puts /usr/local first, and on Kairos /usr/local is the persistent
# COS_PERSISTENT mount, so a binary left there would be picked over the image's own
# and would survive every A/B upgrade.
#
# The value is internal/hostexec.ChildPATH; a Go test binds the two together.
# This file is image-owned (/usr/lib) and sorts after 10-kubeadm.conf, so an
# upgrade always replaces it and it applies even to a stale
# /etc/systemd/system/kubelet.service fragment. An EnvironmentFile= still outranks
# it (systemd exec-invoke.c), which is the documented residual: see
# docs/security.md. To override deliberately, add a later drop-in (60-*.conf)
# under /etc/systemd/system/kubelet.service.d/.
[Service]
Environment=PATH=/usr/sbin:/usr/bin:/sbin:/bin
