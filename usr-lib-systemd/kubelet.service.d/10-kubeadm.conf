# The kubeadm-pattern drop-in for kubelet.service, shipped by this image at
# /usr/lib/systemd/system/kubelet.service.d/10-kubeadm.conf -- the same path the
# upstream kubeadm packages use, and one the kubeadm CLI never touches. kubeadm
# writes only /var/lib/kubelet/kubeadm-flags.env (node-specific flags, during
# init/join); this drop-in wires those flags plus the kubeadm-written config into
# the unit. Operators override it from /etc/systemd/system/kubelet.service.d/
# (see docs/upgrades.md); ADR-19 U2, F-UNITPATH.
[Service]
Environment="KUBELET_KUBECONFIG_ARGS=--bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf --kubeconfig=/etc/kubernetes/kubelet.conf"
Environment="KUBELET_CONFIG_ARGS=--config=/var/lib/kubelet/config.yaml"
EnvironmentFile=-/var/lib/kubelet/kubeadm-flags.env
EnvironmentFile=-/etc/default/kubelet
ExecStart=
ExecStart=/usr/bin/kubelet $KUBELET_KUBECONFIG_ARGS $KUBELET_CONFIG_ARGS $KUBELET_KUBEADM_ARGS $KUBELET_EXTRA_ARGS
