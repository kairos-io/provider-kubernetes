# provider-kubernetes ADR-19 U1 (F-UNITPATH): keep every name containerd resolves,
# and every name the processes it starts resolve, inside the read-only OS image.
#
# PATH. systemd's default PATH puts /usr/local first, and on Kairos /usr/local is
# the persistent COS_PERSISTENT mount, so a binary left there would be picked over
# the image's own and would survive every A/B upgrade. This pins containerd, its
# shims, the CNI plugins (which inherit containerd's environment) and its helpers to
# the image. The value is internal/hostexec.ChildPATH; a Go test binds the two.
#
# CONTAINERD_DISABLE_IGZIP / CONTAINERD_DISABLE_PIGZ (ADR-19 S19-18a). containerd
# looks up igzip, then unpigz, by name on the first layer decompression of each
# daemon lifetime. The image ships neither, so the name resolves nowhere inside /usr
# - and containerd's deprecated NRI v0.1 client APPENDS the persistent /opt/nri/bin
# to the daemon's own PATH at the first sandbox create, which no configuration key
# disables (R-19-13). An appended element cannot shadow a name the image provides,
# but it can supply one the image lacks, so these two names are closed at the source
# instead: with either variable set, containerd skips the lookup entirely and falls
# back to its built-in Go gzip (pkg/archive/compression/compression.go:53-54,
# 310-331 at v2.3.5). Cost today is zero. A derived image that installs pigz or
# igzip for faster decompression must drop these two lines to benefit from it.
# (mkfs.erofs, the third such name, is closed in containerd/config.toml by disabling
# both erofs plugins.)
#
# Image-owned: this file lives under /usr/lib, so an upgrade always replaces it and
# it applies even to a stale /etc/systemd/system/containerd.service fragment. To
# override deliberately, add a later drop-in (60-*.conf) in
# /etc/systemd/system/containerd.service.d/ -- see docs/security.md.
[Service]
Environment=PATH=/usr/sbin:/usr/bin:/sbin:/bin
Environment=CONTAINERD_DISABLE_IGZIP=1
Environment=CONTAINERD_DISABLE_PIGZ=1
